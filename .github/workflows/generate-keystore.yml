name: İmzalama anahtarı üret (tek seferlik)

# Bu workflow'u yalnızca BİR KEZ, elle çalıştırın.
#
# Neden gerekli: yan yüklenen (sideload) APK'ların güncellemelerde aynı anahtarla
# imzalanması şart, aksi halde yeni sürüm eskisinin üzerine kurulamaz. Yerel
# makinede JDK olmadığı için `keytool` orada çalıştırılamıyor; anahtarı burada
# üretip GitHub Secrets'a taşıyoruz.
#
# Çalıştırdıktan sonra:
#   1. Actions sekmesinden "imzalama-anahtari" artifact'ını indirin.
#   2. İçindeki secrets.txt'teki 4 değeri repo → Settings → Secrets and variables
#      → Actions → New repository secret olarak girin.
#   3. Artifact'ı GitHub'dan silin ve keystore.jks'in bir yedeğini güvenli bir
#      yerde saklayın (kaybederseniz uygulamayı bir daha güncelleyemezsiniz,
#      kaldırıp yeniden kurmanız gerekir).

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: JDK 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Anahtar üret
        run: |
          set -euo pipefail
          mkdir -p out

          PW="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          ALIAS="evenvanteri"

          keytool -genkeypair \
            -keystore out/keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PW" \
            -keypass "$PW" \
            -dname "CN=Ev Envanteri, O=Ev, C=TR"

          base64 -w0 out/keystore.jks > out/keystore.jks.base64

          {
            echo "Aşağıdaki 4 değeri repo Secrets'a ekleyin."
            echo "Ekledikten sonra bu artifact'ı GitHub'dan silin."
            echo
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_PASSWORD=$PW"
            echo
            echo "KEYSTORE_BASE64 için keystore.jks.base64 dosyasının TAMAMINI yapıştırın."
          } > out/secrets.txt

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v7
        with:
          name: imzalama-anahtari
          path: out/
          retention-days: 1
